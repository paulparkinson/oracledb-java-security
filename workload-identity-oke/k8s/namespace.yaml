apiVersion: v1
kind: Namespace
metadata:
  name: jdbc-workload-identity
  labels:
    app.kubernetes.io/part-of: oracledb-java-security
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jdbc-allowed
  namespace: jdbc-workload-identity
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jdbc-denied
  namespace: jdbc-workload-identity
automountServiceAccountToken: true
